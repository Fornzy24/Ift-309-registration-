<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
<style>
    * { box-sizing: border-box; }
    body {
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #dbeafe, #e9d5ff);
        margin: 0;
        padding: 30px 15px;
        color: #333;
    }
    header {
        background: linear-gradient(135deg, #1e3a8a, #6d28d9);
        color: white;
        text-align: center;
        padding: 30px 15px;
        border-radius: 12px;
        max-width: 600px;
        margin: 0 auto;
        box-shadow: 0 5px 15px rgba(0,0,0,0.15);
    }
    header h1 { margin: 0 0 10px; font-size: 28px; }
    header p { margin: 0; font-size: 14px; opacity: 0.9; }
    main {
        max-width: 600px;
        margin: 25px auto;
        background: white;
        padding: 35px;
        border-radius: 15px;
        box-shadow: 0 8px 25px rgba(0,0,0,0.12);
    }
    h2 {
        color: #4c1d95;
        text-align: center;
        margin: 0 0 30px;
        font-size: 23px;
    }
    .form-group { margin-bottom: 22px; }
    label {
        display: block;
        margin-bottom: 8px;
        font-size: 14px;
        font-weight: bold;
        color: #374151;
    }
    input, select {
        width: 100%;
        padding: 13px;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        font-size: 14px;
        background: #f9fafb;
        outline: none;
        transition: 0.3s;
    }
    input:focus, select:focus {
        border-color: #6d28d9;
        background: white;
        box-shadow: 0 0 5px rgba(109,40,217,0.2);
    }
    fieldset {
        border: 1px solid #d1d5db;
        border-radius: 8px;
        padding: 15px;
        margin-left: 0;
        margin-right: 0;
    }
    legend { font-weight: bold; color: #374151; padding: 0 5px; }
    fieldset label { display: inline; margin-right: 20px; font-weight: normal; }
    fieldset input { width: auto; margin-right: 5px; accent-color: #6d28d9; }
    button {
        background: linear-gradient(135deg, #1e3a8a, #6d28d9);
        color: white;
        padding: 15px;
        width: 100%;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s;
    }
    button:hover {
        background: linear-gradient(135deg, #172554, #4c1d95);
        transform: translateY(-2px);
    }
    footer { text-align: center; color: #777; font-size: 12px; margin-top: 25px; }
    @media (max-width: 480px) {
        main { padding: 25px 18px; }
        header h1 { font-size: 23px; }
    }
</style>
</head>
<body>
    <header>
        <h1>Student Registration</h1>
        <p>IFT 309 Assignment</p>
    </header>
    <main>
        <section>
            <h2>Registration Form</h2>
            <form action="#" method="post">
                <div class="form-group">
                    <label for="name">Full Name:</label>
                    <input type="text" id="name" name="name" placeholder="Enter your full name" required>
                </div>
                <div class="form-group">
                    <label for="matric">Matric Number:</label>
                    <input type="text" id="matric" name="matric" placeholder="Enter your matric number" required>
                </div>
                <div class="form-group">
                    <label for="department">Department:</label>
                    <select id="department" name="department" required>
                        <option value="">Select department</option>
                        <option>Information Technology</option>
                        <option>Computer Science</option>
                        <option>Software Engineering</option>
                        <option>Cybersecurity</option>
                        <option>Information Systems</option>
                        <option>Data Science</option>
                        <option>Artificial Intelligence</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" placeholder="Enter your email" required>
                </div>
                <div class="form-group">
                    <label for="phone">Phone Number:</label>
                    <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" required>
                </div>
                <fieldset class="form-group">
                    <legend>Gender:</legend>
                    <input type="radio" id="male" name="gender" value="Male" required>
                    <label for="male">Male</label>
                    <input type="radio" id="female" name="gender" value="Female">
                    <label for="female">Female</label>
                </fieldset>
                <div class="form-group">
                    <label for="programme">Programme:</label>
                    <select id="programme" name="programme" required>
                        <option value="">Select programme</option>
                        <option>Full-time</option>
                        <option>Weekday</option>
                        <option>Weekend</option>
                    </select>
                </div>
                <button type="submit">Submit Registration</button>
            </form>
        </section>
        <footer>Student Registration Portal | IFT 309</footer>
    </main>
</body>
</html>
